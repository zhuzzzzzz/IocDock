networks:
  hostnet:
    external: true
    name: host
services:
  srv-caGateway:
    image: ca-gateway:0.0.1
    command:
    - -archive
    - -no_cache
    - -access 
    - /etc/gateway/default.acf
    - -prefix 
    - dft-cagw
    - -putlog
    - /default-data/putlog-dft-cagw
    - -report
    - /default-data/report-dft-cagw
    labels:
      service-type: local
      prometheus-job: caGateway
    networks:
    - hostnet
    deploy:
      mode: global
      resources:
        limits:
          cpus: "1"
          memory: 1G
      placement:
        constraints:
        - node.platform.os==linux
        - node.labels.cagateway==true
        - node.labels.gateway-name==default
    volumes:
    - source: /etc/localtime
      target: /etc/localtime
      type: bind
      read_only: true
    - source: /etc/hostname
      target: /etc/hostname
      type: bind
      read_only: true
    - source: ./config
      target: /etc/gateway
      type: bind
      read_only: true
    - source: ../../../default-data
      target: /default-data
      type: bind
